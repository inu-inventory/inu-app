services:
  db:
    image: postgres:16-alpine
    container_name: inu-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-inu_inventory}
      POSTGRES_USER: ${POSTGRES_USER:-inu}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-inu_secret}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-inu} -d ${POSTGRES_DB:-inu_inventory}"]
      interval: 5s
      timeout: 5s
      retries: 10

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: inu-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@inu.edu.tr}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    ports:
      - "5050:80"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - pgadmin_data:/var/lib/pgadmin

  backend:
    build: ./backend
    container_name: inu-backend
    environment:
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-inu_inventory}
      DB_USER: ${POSTGRES_USER:-inu}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-inu_secret}
      JWT_SECRET: ${JWT_SECRET:-change-me-change-me-change-me-change-me-0123456789}
      CORS_ORIGINS: http://localhost:3000
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        API_BASE_URL: http://localhost:8080
    container_name: inu-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  pgdata:
  pgadmin_data:

