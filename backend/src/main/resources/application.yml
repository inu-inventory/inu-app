server:
  port: 8080

spring:
  application:
    name: inu-inventory
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/inu_inventory}
    username: ${DB_USER:inu}
    password: ${DB_PASSWORD:inu_secret}
  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:update}
    open-in-view: false

app:
  jwt:
    secret: ${JWT_SECRET:change-me-change-me-change-me-change-me-0123456789}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:3000,http://localhost:8081}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health

